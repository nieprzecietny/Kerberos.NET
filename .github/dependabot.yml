# Dependabot: cotygodniowe PR-y z nowszymi wersjami zależności (minor i patch, jeden zbiorczy PR
# na ekosystem) oraz poprawki bezpieczeństwa z alertów, też zebrane w jeden PR.
# Wersje major są pominięte: to migracje, nie podbicia — robi się je ręcznie.
version: 2
updates:
  - package-ecosystem: nuget
    directories: ["/", "/Bruce", "/Fiddler.Kerberos.NET", "/Fiddler.Kerberos.NET/Fiddler.Kerberos.NET", "/Fiddler.Kerberos.NET/InstallHost", "/Fiddler.Kerberos.NET/KerberosInstaller", "/Kerberos.NET", "/Samples", "/Samples/KerbCrypto", "/Samples/KerbDump", "/Samples/KerbDumpCore", "/Samples/KerbTester", "/Samples/KerberosClientApp", "/Samples/KerberosKdcHostApp", "/Samples/KerberosMiddlewareEndToEndSample", "/Samples/KerberosMiddlewareSample", "/Samples/KerberosWebSample", "/Tests/Benchmark.Kerberos.NET", "/Tests/Tests.Kerberos.NET"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
      nuget-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
